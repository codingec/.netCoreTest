apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-frontend
  labels:
    app.kubernetes.io/name: booking-frontend
    app.kubernetes.io/component: web
spec:
  # Must match minReplicas in hpa.yaml.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: booking-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: booking-frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: booking-app
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
        - name: web
          image: booking-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: NGINX_ENTRYPOINT_QUIET_LOGS
              valueFrom:
                configMapKeyRef:
                  name: booking-frontend-config
                  key: NGINX_ENTRYPOINT_QUIET_LOGS
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            # ConfigMap changes are not picked up by running pods (subPath mount);
            # run: kubectl -n booking rollout restart deploy/booking-frontend
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
              readOnly: true
      volumes:
        - name: nginx-conf
          configMap:
            name: booking-frontend-config
            items:
              - key: default.conf
                path: default.conf
