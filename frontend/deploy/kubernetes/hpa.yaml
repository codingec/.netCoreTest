apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: booking-frontend
  labels:
    app.kubernetes.io/name: booking-frontend
    app.kubernetes.io/component: web
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: booking-frontend
  minReplicas: 1
  maxReplicas: 5
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
