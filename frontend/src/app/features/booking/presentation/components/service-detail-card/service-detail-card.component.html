<div
  class="service-detail-card clickable-card"
  tabindex="0"
  role="button"
  [attr.aria-label]="serviceDetail().name"
  (click)="selected.emit(serviceDetail())"
  (keydown.enter)="$event.preventDefault(); selected.emit(serviceDetail())"
  (keydown.space)="$event.preventDefault(); selected.emit(serviceDetail())"
>
  <mat-card appearance="outlined">
    <mat-card-header>
      <mat-card-title class="card-text">{{ serviceDetail().name }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="description card-text">{{ serviceDetail().description }}</p>
      <mat-list>
        @for (item of characteristics(); track $index) {
          <mat-list-item>
            <span matListItemTitle class="characteristic-value card-text">{{ item.value }}</span>
            <span matListItemLine class="characteristic-name">{{ item.name }}</span>
          </mat-list-item>
        }
      </mat-list>
    </mat-card-content>
  </mat-card>
</div>
