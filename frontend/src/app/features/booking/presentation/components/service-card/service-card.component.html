<div
  class="service-card clickable-card"
  tabindex="0"
  role="button"
  [attr.aria-label]="service().name"
  (click)="onSelected.emit(service().id)"
  (keydown.enter)="$event.preventDefault(); onSelected.emit(service().id)"
  (keydown.space)="$event.preventDefault(); onSelected.emit(service().id)"
>
  <mat-card appearance="outlined">
    <img
      #media
      class="card-media"
      [src]="service().imageUrl"
      [alt]="service().name"
      (error)="media.classList.add('is-broken')"
    />
    <mat-card-header>
      <mat-card-title class="card-text">{{ service().name }}</mat-card-title>
    </mat-card-header>
    <mat-card-content>
      <p class="description card-text">{{ service().description }}</p>
      <mat-list>
        @for (item of characteristics(); track $index) {
          <mat-list-item>
            <span matListItemTitle class="characteristic-value card-text">{{ item.value }}</span>
            <span matListItemLine class="characteristic-name">{{ item.name }}</span>
          </mat-list-item>
        }
      </mat-list>
    </mat-card-content>
  </mat-card>
</div>
