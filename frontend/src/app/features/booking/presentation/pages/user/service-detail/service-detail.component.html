<header class="page-header">
  <h1>Available spots</h1>
  <p>Choose a spot to book a time slot.</p>
</header>

<div class="card-grid">
  @for (item of service()?.serviceDetails; track item.id) {
    <app-service-detail-card
      [serviceDetail]="item"
      (selected)="openModal(item)"
    ></app-service-detail-card>
  }
</div>

<section class="section">
  <h2>Bookings</h2>
  <div class="table-scroll">
    <table mat-table [dataSource]="dataSource">
      <ng-container matColumnDef="employeeName">
        <th mat-header-cell *matHeaderCellDef>Employee</th>
        <td mat-cell *matCellDef="let row">{{ row.employeeName }}</td>
      </ng-container>

      <ng-container matColumnDef="serviceDetailName">
        <th mat-header-cell *matHeaderCellDef>Spot</th>
        <td mat-cell *matCellDef="let row">{{ row.serviceDetailName }}</td>
      </ng-container>

      <ng-container matColumnDef="startDateTime">
        <th mat-header-cell *matHeaderCellDef>Start</th>
        <td mat-cell *matCellDef="let row">
          {{ row.startDateTime | date: "short" }}
        </td>
      </ng-container>

      <ng-container matColumnDef="endDateTime">
        <th mat-header-cell *matHeaderCellDef>End</th>
        <td mat-cell *matCellDef="let row">
          {{ row.endDateTime | date: "short" }}
        </td>
      </ng-container>

      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      <tr class="mat-row" *matNoDataRow>
        <td class="mat-cell empty-state" [attr.colspan]="displayedColumns.length">
          No bookings yet
        </td>
      </tr>
    </table>
  </div>
</section>
