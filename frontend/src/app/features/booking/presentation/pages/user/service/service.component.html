<header class="page-header">
  <h1>Available services</h1>
  <p>Pick the type of space you need.</p>
</header>

<div class="card-grid">
  @for (item of services$ | async; track item.id) {
    <app-service-card
      [service]="item"
      (onSelected)="onSelectCard($event)"
    ></app-service-card>
  } @empty {
    <p class="empty-state">No services available for this office.</p>
  }
</div>
