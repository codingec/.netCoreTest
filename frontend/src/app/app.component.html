@if (showToolbar()) {
  <mat-toolbar class="app-toolbar">
    @if (showBack()) {
      <button mat-icon-button aria-label="Go back" (click)="back()">
        <mat-icon>arrow_back</mat-icon>
      </button>
    }
    <a class="brand" routerLink="/booking/working-place">
      <span>Booking</span>
    </a>
  </mat-toolbar>
}

<main [class.page]="showToolbar()">
  <router-outlet />
</main>
