apiVersion: apps/v1
kind: Deployment
metadata:
  name: booking-backend
  labels:
    app.kubernetes.io/name: booking-backend
    app.kubernetes.io/component: api
spec:
  # Must match minReplicas in hpa.yaml.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: booking-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: booking-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: booking-app
    spec:
      securityContext:
        runAsNonRoot: true
        # 1654 is the "app" user in the official .NET images; lets it write to /data.
        fsGroup: 1654
      containers:
        - name: api
          image: booking-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: booking-backend-config
            - secretRef:
                name: booking-backend-secret
          resources:
            requests:
              cpu: 250m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        # Per-pod scratch storage for the SQLite file: created and seeded on start,
        # lost when the pod is deleted (accepted trade-off, see spec clarification).
        - name: data
          emptyDir:
            sizeLimit: 100Mi
