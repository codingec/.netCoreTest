# EXAMPLE ONLY. Not listed in kustomization.yaml and never applied as-is.
# Create the real secret instead (the key must be at least 32 bytes):
#
#   kubectl -n booking create secret generic booking-backend-secret \
#     --from-literal=Jwt__Key="$(openssl rand -hex 32)"
#
apiVersion: v1
kind: Secret
metadata:
  name: booking-backend-secret
  namespace: booking
  labels:
    app.kubernetes.io/name: booking-backend
    app.kubernetes.io/component: api
type: Opaque
stringData:
  Jwt__Key: "REPLACE_WITH_A_RANDOM_VALUE_OF_AT_LEAST_32_BYTES"
